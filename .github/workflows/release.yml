name: Release

# Every push (i.e. every commit landing on GitHub) publishes a fresh release
# with freshly built Windows installers. When the updater signing key is
# configured, the release also carries signed update artifacts + latest.json,
# so installed copies update themselves.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Ensure ffmpeg resource
        shell: pwsh
        run: |
          $dest = "src-tauri/resources/bin/ffmpeg.exe"
          if (Test-Path $dest) {
            Write-Host "ffmpeg resource already present"
            exit 0
          }
          Write-Host "ffmpeg resource missing — fetching a static build"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          npm install --no-save ffmpeg-static
          Copy-Item "node_modules/ffmpeg-static/ffmpeg.exe" $dest

      - name: Compute build metadata
        id: meta
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          "version=$version" >> $env:GITHUB_OUTPUT
          "short_sha=$sha" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Stamp app version
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = "${{ steps.meta.outputs.version }}"
          $json | ConvertTo-Json -Depth 32 | Set-Content $path -Encoding utf8
          Write-Host "App version set to $($json.version)"

      - name: Detect updater signing key
        id: signing
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            Write-Host "No signing key configured — building a plain release."
            "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Signing key found — updater artifacts enabled."
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Enable updater artifacts
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.bundle.createUpdaterArtifacts = $true
          $json | ConvertTo-Json -Depth 32 | Set-Content $path -Encoding utf8

      # Build only. Publishing is handled below by action-gh-release, which
      # updates an existing release in place instead of creating one through
      # tauri-action (that release call intermittently fails with a
      # content-length mismatch).
      - name: Build installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run dist

      # The bundler only emits `.sig` files; the update manifest is ours to
      # build. It points at the NSIS installer for this exact tag.
      - name: Generate updater manifest
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $repo = "${{ github.repository }}"
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "*.sig" } | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found to describe in latest.json" }
          $sigPath = "$($installer.FullName).sig"
          if (-not (Test-Path $sigPath)) { throw "Missing signature for $($installer.Name)" }
          $manifest = [ordered]@{
            version   = $version
            notes     = "NovaTube $version"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sigPath -Raw).Trim()
                url       = "https://github.com/$repo/releases/download/$tag/$($installer.Name)"
              }
            }
          }
          $out = "src-tauri/target/release/bundle/latest.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content $out -Encoding utf8
          Write-Host "Wrote $out"
          Get-Content $out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "NovaTube ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.short_sha }})"
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: false
          generate_release_notes: false
          body: |
            NovaTube ${{ steps.meta.outputs.version }} — built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            - Windows installers (MSI and NSIS) are attached below.
            - Installed copies update themselves when a newer release appears.
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/latest.json

      # Uploads are retried once, then every asset is compared byte-for-byte
      # against the file on disk so a truncated upload can never ship silently.
      - name: Verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $expected = @{}
          foreach ($pattern in @(
            "src-tauri/target/release/bundle/msi/*.msi",
            "src-tauri/target/release/bundle/msi/*.msi.sig",
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/nsis/*.exe.sig",
            "src-tauri/target/release/bundle/latest.json"
          )) {
            Get-ChildItem $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              $expected[$_.Name] = $_.Length
            }
          }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $json = gh release view $tag --json assets | ConvertFrom-Json
            $actual = @{}
            foreach ($asset in $json.assets) { $actual[$asset.name] = $asset.size }

            $mismatched = @()
            foreach ($name in $expected.Keys) {
              if (-not $actual.ContainsKey($name)) {
                $mismatched += "$name (missing)"
              } elseif ([int64]$actual[$name] -ne [int64]$expected[$name]) {
                $mismatched += "$name (remote $($actual[$name]) vs local $($expected[$name]))"
              }
            }

            if ($mismatched.Count -eq 0) {
              Write-Host "All $($expected.Count) assets verified."
              exit 0
            }

            Write-Host "Attempt ${attempt}: $($mismatched -join '; ')"
            if ($attempt -lt 3) {
              Write-Host "Re-uploading mismatched files…"
              $files = $mismatched | ForEach-Object { $_ -replace " \(.*$", "" }
              foreach ($name in $files) {
                $path = Get-ChildItem -Recurse "src-tauri/target/release/bundle" -Filter $name | Select-Object -First 1
                if ($path) { gh release upload $tag $path.FullName --clobber }
              }
              Start-Sleep -Seconds 5
            }
          }

          throw "Release assets did not match the local files after retries."
