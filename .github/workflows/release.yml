name: Release

# Every push (i.e. every commit landing on GitHub) publishes a fresh release
# with freshly built Windows installers. When the updater signing key is
# configured, the release also carries signed update artifacts + latest.json,
# so installed copies update themselves.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Ensure ffmpeg resource
        shell: pwsh
        run: |
          $dest = "src-tauri/resources/bin/ffmpeg.exe"
          if (Test-Path $dest) {
            Write-Host "ffmpeg resource already present"
            exit 0
          }
          Write-Host "ffmpeg resource missing — fetching a static build"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          npm install --no-save ffmpeg-static
          Copy-Item "node_modules/ffmpeg-static/ffmpeg.exe" $dest

      - name: Compute build metadata
        id: meta
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          "version=$version" >> $env:GITHUB_OUTPUT
          "short_sha=$sha" >> $env:GITHUB_OUTPUT
          "tag=v$version.${{ github.run_attempt }}" >> $env:GITHUB_OUTPUT

      - name: Stamp app version
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = "${{ steps.meta.outputs.version }}"
          $json | ConvertTo-Json -Depth 32 | Set-Content $path -Encoding utf8
          Write-Host "App version set to $($json.version)"

      - name: Detect updater signing key
        id: signing
        shell: pwsh
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEY)) {
            Write-Host "No signing key configured — building a plain release."
            "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Signing key found — updater artifacts enabled."
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Enable updater artifacts
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.bundle.createUpdaterArtifacts = $true
          $json | ConvertTo-Json -Depth 32 | Set-Content $path -Encoding utf8

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "NovaTube ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.short_sha }})"
          releaseBody: |
            Automated build from commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            - yt-dlp is downloaded on first launch
            - ffmpeg is bundled with the installer
            - installed copies update themselves when a newer release appears
          releaseDraft: false
          prerelease: false