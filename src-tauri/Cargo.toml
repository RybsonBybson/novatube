[package]
name = "novatube"
version = "1.0.0"
description = "NovaTube — minimal media downloader"
authors = ["NovaTube"]
edition = "2021"

[lib]
name = "novatube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "fs", "sync", "rt", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["stream"] }
regex = "1"
rfd = "0.15"
dirs = "6"
url = "2"
arboard = "3"
opener = { version = "0.7", features = ["reveal"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
